{% extends "base.html" %}
{% block title %}IL Vacation Budget{% endblock %}
{% block content %}
<div class="hero">
  <h1>IL Vacation Budget</h1>
  <p>Tracking {{ destination_count }} destinations, departing from Israel.</p>
</div>

<div class="card">
  <form method="post" action="{{ url_for('estimate.estimate') }}">
    <label>
      Origin airport
      <select name="origin_iata" required>
        {% for a in origins %}
          <option value="{{ a.iata_code }}">{{ a.city_name }} ({{ a.iata_code }})</option>
        {% endfor %}
      </select>
    </label>

    <label>
      Departure date
      <input type="date" id="depart_date" name="depart_date" value="{{ default_depart_date }}" required>
    </label>

    <label>
      Return date
      <input type="date" id="return_date" name="return_date" value="{{ default_return_date }}" min="{{ min_return_date }}" required>
    </label>

    <label>
      Budget
      <input type="number" name="budget_amount" min="1" step="1" value="5000" required>
    </label>

    <label>
      Budget currency
      <select name="budget_currency">
        <option value="ILS" selected>ILS</option>
        <option value="USD">USD</option>
        <option value="EUR">EUR</option>
      </select>
    </label>

    <label>
      Hotel tier
      <select name="hotel_tier">
        <option value="budget">Budget (avg of cheapest ~10 hotels)</option>
        <option value="average" selected>Average (all hotels found)</option>
        <option value="luxury">Luxury (avg of priciest ~10 hotels)</option>
      </select>
    </label>

    <button type="submit" class="btn">Estimate</button>
  </form>
</div>

<script>
  // return_date's "min" is rendered server-side as depart_date+1 (works even
  // before this script runs). This just keeps it in sync if the user changes
  // depart_date afterwards -- the browser's own date picker then refuses to
  // let return_date go below that. Server still re-validates independently
  // in app/routes/estimate.py either way.
  document.getElementById("depart_date").addEventListener("change", function () {
    const d = new Date(this.value + "T00:00:00");
    d.setDate(d.getDate() + 1);
    document.getElementById("return_date").min = d.toISOString().slice(0, 10);
  });
</script>
{% endblock %}
