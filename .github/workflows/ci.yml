name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vacation
          POSTGRES_PASSWORD: vacation
          POSTGRES_DB: vacation_budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vacation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: postgresql://vacation:vacation@localhost:5432/vacation_budget
      # The app refuses to start without one; the route tests only need it to exist.
      FLASK_SECRET_KEY: ci-only-not-a-secret

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Migrations and seed data on a clean database
        run: |
          uv run python -m etl.loaders.run_migrations
          uv run python -m etl.loaders.load_airports
          uv run python -m etl.loaders.load_destinations_seed

      - name: Tests
        run: uv run pytest -v
