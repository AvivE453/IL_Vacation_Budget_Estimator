name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    # Pinned rather than ubuntu-latest, which moves to a new Ubuntu release on
    # GitHub's schedule; upgrading the runner should be our own deliberate commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vacation
          POSTGRES_PASSWORD: vacation
          POSTGRES_DB: vacation_budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vacation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: postgresql://vacation:vacation@localhost:5432/vacation_budget

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Migrations and seed data on a clean database
        run: |
          uv run python -m etl.loaders.run_migrations
          uv run python -m etl.loaders.load_airports
          uv run python -m etl.loaders.load_destinations_seed

      - name: Tests
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # The same Node as locally (.nvmrc); npm ci installs exactly package-lock.json.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # schema.d.ts is generated from api/openapi.json and committed; regenerate
      # it and fail if that changes anything, so the types can't drift from the API.
      - name: API types match the API schema
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts

      - name: Component tests
        run: npm test

      - name: Type check and build
        run: npm run build

  terraform:
    # Checks infra/ without touching AWS: no credentials here, and
    # init -backend=false never reads the state bucket. apply stays manual.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      # The same Terraform as locally.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.7

      - name: Formatting
        run: terraform fmt -check

      # The provider versions come from the committed .terraform.lock.hcl.
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  e2e:
    # The whole app in a real browser: Vite + FastAPI + Postgres, with the
    # fixed data from tests/e2e_data.py and live flight search off.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vacation
          POSTGRES_PASSWORD: vacation
          POSTGRES_DB: vacation_budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vacation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: postgresql://vacation:vacation@localhost:5432/vacation_budget

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Google Chrome, as locally (playwright.config.ts -> channel).
      - name: Install Chrome
        working-directory: frontend
        run: npx playwright install --with-deps chrome

      - name: End-to-end tests
        working-directory: frontend
        run: npx playwright test

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results/

  deploy:
    # master only, and only once every job above has passed (ROADMAP 4.9).
    if: github.ref == 'refs/heads/master'
    needs: [test, frontend, terraform, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The AWS key is a secret of this environment, whose deployment branch
    # rule hands it only to runs on master: no other branch's workflow can read it.
    environment: production
    # A second deploy waits for the one running instead of overlapping it.
    concurrency:
      group: deploy
      cancel-in-progress: false

    # The only job holding a secret, so its actions are pinned to the commit
    # of their release: a moved tag can't run new code next to the AWS key.
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installing and building run third-party code (package install scripts,
      # Vite's plugins), so they run here, before the key is in any step's
      # environment.
      - name: Build the API zip and the React app
        run: |
          uv sync --locked
          (cd frontend && npm ci)
          scripts/build_lambda.sh
          (cd frontend && npm run build)

      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-north-1
          # A secret too: the bucket's name holds the account id, and GitHub
          # masks a secret's value in the log.
          SITE_BUCKET: ${{ secrets.SITE_BUCKET }}
          SITE_URL: https://d2r41mkrvtiz2x.cloudfront.net/
          API_FUNCTION: vacation-budget-api
          JOBS_FUNCTION: vacation-budget-jobs
          SKIP_BUILD: "1"
        run: scripts/deploy.sh
